[build]
  command = "cd client && npm install && npm run build && cd ../netlify/functions && npm install"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["bcrypt"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/upload/*"
  to = "/.netlify/functions/api/upload/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/addtocart"
  to = "/.netlify/functions/api/addtocart"
  status = 200
  force = true

[[redirects]]
  from = "/removefromcart"
  to = "/.netlify/functions/api/removefromcart"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
